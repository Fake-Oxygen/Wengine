# WEngine UART sample: printk console + polled UART only.
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
# Set y for COBS framing (must match --emit-uart-mode on the host).
CONFIG_WUART_COBS=n
# Set y on single-UART boards (e.g. stm32f469i_disco) together with host
# --control-uart: TX carries control frames only (no sample printks), so
# the host malformed counter stays clean. See WUART_QUIET help.
# CONFIG_WUART_QUIET=y
